appKey: atlas-system-tester

images:
  api:
    repository: registry.local/atlas/atlas-system-tester-api
    tag: "0.1.0"
    pullPolicy: IfNotPresent

api:
  replicaCount: 1
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi

# Persistent volume for saved test plans + run history (/data/atlas-system-tester).
storage:
  data:
    size: 1Gi
    accessMode: ReadWriteOnce
    storageClass: ""

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

# Headless / agent access. Lets a Claude instance drive the tester over a
# kubectl port-forward without a browser. See docs/agent-access.md.
agent:
  # Bearer token guarding the /agent/* API. When empty the API is open (reachable
  # only via port-forward / in-cluster). Set a value to require the token.
  token: ""
  # Admin credentials for headless auto-connect. When both are set the server
  # signs in at startup so `POST /agent/run` works with no connect round-trip.
  adminEmail: ""
  adminPassword: ""
  # Force auto-connect even if creds are supplied another way. Auto-connect is
  # also implied whenever adminEmail + adminPassword are both set.
  autoConnect: false

# Extra environment variables injected into the container.
env: {}
