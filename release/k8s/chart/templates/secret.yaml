{{- if or .Values.agent.token .Values.agent.adminEmail .Values.agent.adminPassword }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "atlas-varify.name" . }}-agent
  labels:
    {{- include "atlas-varify.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Only the keys that are set are rendered; the Deployment references them with
  # optional: true so absent keys simply mean "feature off".
  {{- with .Values.agent.token }}
  VARIFY_AGENT_TOKEN: {{ . | quote }}
  {{- end }}
  {{- with .Values.agent.adminEmail }}
  VARIFY_ADMIN_EMAIL: {{ . | quote }}
  {{- end }}
  {{- with .Values.agent.adminPassword }}
  VARIFY_ADMIN_PASSWORD: {{ . | quote }}
  {{- end }}
{{- end }}
