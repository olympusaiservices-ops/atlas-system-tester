apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "atlas-verify.name" . }}
  labels:
    {{- include "atlas-verify.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "atlas-verify.name" . }}
  template:
    metadata:
      labels:
        app: {{ include "atlas-verify.name" . }}
        app.kubernetes.io/component: api
    spec:
      containers:
        - name: api
          image: "{{ .Values.images.api.repository }}:{{ .Values.images.api.tag }}"
          imagePullPolicy: {{ .Values.images.api.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          env:
            # The server derives all Atlas Core service URLs from the namespace
            # (http://atlas-core-*.<ns>.svc.cluster.local).
            - name: ATLAS_NAMESPACE
              value: "{{ .Release.Namespace }}"
            - name: PORT
              value: "{{ .Values.service.targetPort }}"
            - name: VERIFY_DATA_DIR
              value: "/data/atlas-verify"
            # Explicit per-service overrides (constructed here, not in values.yaml).
            - name: ATLAS_IDENTITY_URL
              value: "http://atlas-core-identity.{{ .Release.Namespace }}.svc.cluster.local"
            - name: ATLAS_EMAIL_URL
              value: "http://atlas-core-email.{{ .Release.Namespace }}.svc.cluster.local"
            - name: ATLAS_APPSTORE_URL
              value: "http://atlas-core-app-store.{{ .Release.Namespace }}.svc.cluster.local"
            - name: ATLAS_NETWORK_URL
              value: "http://atlas-core-network.{{ .Release.Namespace }}.svc.cluster.local"
            - name: ATLAS_PORTAL_API_URL
              value: "http://atlas-core-portal-api.{{ .Release.Namespace }}.svc.cluster.local"
            # Headless agent access (all optional — absent Secret keys = feature off).
            - name: VERIFY_AUTO_CONNECT
              value: "{{ .Values.agent.autoConnect }}"
            - name: VERIFY_AGENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "atlas-verify.name" . }}-agent
                  key: VERIFY_AGENT_TOKEN
                  optional: true
            - name: VERIFY_ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: {{ include "atlas-verify.name" . }}-agent
                  key: VERIFY_ADMIN_EMAIL
                  optional: true
            - name: VERIFY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "atlas-verify.name" . }}-agent
                  key: VERIFY_ADMIN_PASSWORD
                  optional: true
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data/atlas-verify
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "atlas-verify.name" . }}-data
