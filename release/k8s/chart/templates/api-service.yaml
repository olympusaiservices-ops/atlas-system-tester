apiVersion: v1
kind: Service
metadata:
  # The Service name MUST equal appKey so the app is reachable at
  # http://{appKey}.{namespace}.svc.cluster.local
  name: {{ include "atlas-verify.name" . }}
  labels:
    {{- include "atlas-verify.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app: {{ include "atlas-verify.name" . }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
      name: http
